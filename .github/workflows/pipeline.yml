# The whole pipeline: tests on every push, release on a version tag.
#
# A push to `develop`/`main`, or a pull request, runs the fast half: lint,
# type-check and the unit suites (backend Jest against a real Postgres, frontend
# Vitest). That is the loop a developer waits on.
#
# A tag matching `v*` runs the same half, then the Playwright suite against the
# disposable database, then builds and pushes the image to GHCR, then asks the
# server to deploy it. Nothing reaches production unless every one of those
# steps passed, and a failed deploy rolls the server back to the previous tag
# (see `deploy/server/gravindex-deploy.sh`).
#
# ⚠️ The e2e suite is deliberately tag-only. It is 122 browser tests with
# single-worker, no-retry semantics that take ~10 minutes; running it on every
# push would make the loop people actually use four times slower for a signal
# the tag gate already gives.
name: pipeline

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to a branch cancels the previous run for that branch. A tag never
# cancels: a release that is half-deployed is worse than a slow one.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Several backend suites create and drop their own `gravindex_test_*`
      # databases, so they need a real server with CREATEDB rights. The image's
      # POSTGRES_USER is a superuser, which is exactly that.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gravindex
          POSTGRES_PASSWORD: gravindex
          POSTGRES_DB: gravindex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gravindex -d gravindex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: gravindex
      DB_PASSWORD: gravindex
      DB_NAME: gravindex
      # Dummy on purpose. The backend refuses to boot without one, and no test
      # may depend on a real signing key.
      JWT_SECRET: ci-signing-key-not-a-secret-000000000000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The e2e stack boots `gravindex-test-db` through `docker compose
      # --profile test`, which interpolates the root `.env`. The template's
      # placeholders are fine except for the signing key, and the scheduled
      # ingestion job is switched off so nothing reaches for the network.
      - name: Write the test environment
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^INGEST_CRON=.*/INGEST_CRON=off/" .env

      - name: Start the disposable database
        run: npm run test:db:up
      - name: Apply the migrations and load the fixture
        run: npm run test:db:seed
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the suite
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: test/e2e/.artifacts
          retention-days: 7

  image:
    name: Build and push the image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # `ghcr.io/dicren/gravindex:v2.0.0` is what `IMAGE_TAG` on the server
          # resolves to; `latest` is a convenience for a `docker pull` by hand.
          tags: |
            ghcr.io/${{ github.repository_owner }}/gravindex:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/gravindex:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://indice.gravina82.com
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts
          # The server's authorized_keys entry forces this key through
          # `/usr/local/bin/gravindex-deploy`; the argument is the tag.
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_REF_NAME"
